<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>

<style>
:root{--bg:#0f172a;--panel:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--accent:#38bdf8;--ok:#22c55e;--danger:#ef4444}
body.light{--bg:#f8fafc;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#0284c7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:15px 24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}
h1,h2{margin:0}
h1{font-size:22px;color:var(--accent)}
.wrap{max-width:1200px;margin:24px auto;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.wide{grid-column:1/-1}
label{font-size:13px;color:var(--muted)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
.actions,.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:transparent;color:var(--text);font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#001018;border-color:transparent}
.danger{color:var(--danger)}
.ok{color:var(--ok)}
.sizes{display:flex;gap:7px;flex-wrap:wrap}
.size{border:1px solid var(--border);border-radius:7px;padding:6px 9px;cursor:pointer}
.size input{width:auto}
.size:has(input:checked){border-color:var(--accent);color:var(--accent)}
.toolbar{margin:14px 0}
.toolbar input{flex:1;min-width:220px}
.toolbar select{width:auto}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.info{display:flex;gap:12px;align-items:center;min-width:0}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--bg)}
.name{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.item-actions{display:flex;gap:7px}
.count{color:var(--muted);font-size:13px}
.status{padding:12px;text-align:center;color:var(--muted)}
.settings{display:flex;gap:8px;align-items:center}
.settings select{width:auto}
.hidden{display:none!important}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}
.grid2{grid-template-columns:1fr}
.wide{grid-column:auto}
.item{align-items:flex-start;flex-direction:column}
.item-actions{width:100%}
.item-actions .btn{flex:1}
.toolbar select{width:100%}
}
</style>

<style id="namet-admin-redesign-v1">

.drawer-field select{width:100%!important;background:var(--panel2);padding:13px 14px}

.wrap{max-width:1120px!important;margin:34px auto!important;padding:0 20px!important}
.panel{background:var(--panel)!important;border:1px solid var(--border)!important;border-radius:18px!important;padding:28px!important;margin-bottom:24px!important;box-shadow:0 1px 0 rgba(255,255,255,.015);transition:background .28s ease,border .28s ease,transform .25s ease}
.section-kicker{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-bottom:8px}
h2{font-size:23px;letter-spacing:-.02em}
.grid2{gap:18px!important}
.field{gap:8px!important}
label{font-size:13px!important;font-weight:650;color:var(--muted)!important}
input,select{background:var(--panel2)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:11px!important;padding:13px 14px!important;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease,background .28s ease}
input:hover,select:hover{border-color:color-mix(in srgb,var(--border),var(--text) 20%)!important}
input:focus,select:focus{border-color:var(--text)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 9%,transparent)!important}
input[type=file]{padding:10px!important}
.btn{border-radius:11px!important;padding:12px 16px!important;transition:transform .18s ease,background .18s ease,border-color .18s ease,opacity .18s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.primary{background:var(--text)!important;color:var(--bg)!important;border-color:var(--text)!important}
.primary:hover{opacity:.88}
.actions .primary{min-width:220px}
.danger{color:#ff6666!important}.ok{color:#66d47b!important}

/* Full tile selection: checkbox exists for functionality, but no checkbox mark is shown. */
.sizes{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px!important}

 function fmtPrice(v){
  let n=Number(v)||0,
  usd=$("currency").value==="USD",
  locale={
    uk:"uk-UA",
    ru:"ru-RU",
    en:"en-US",
    be:"be-BY",

  }

  return new Intl.NumberFormat(locale,{
    style:"currency",currency:usd?"USD":"UAH",maximumFractionDigits:usd?2:0
  }).format(usd?n/UAH_PER_USD:n)
}
 
const SUBCATEGORIES={

function subcategoryUI(selected=null){
  const select=$("subcategory");
  if(!select)return;
  const category=$("category").value;
  const rows=SUBCATEGORIES[category]||[];
  select.replaceChildren();
  rows.forEach(([value,label])=>{
    const o=document.createElement("option");
    o.value=value;
    o.textContent=label;
    select.appendChild(o);
  });

  // Important: only select the product's saved subcategory if it belongs
  // to the current category. Otherwise use that category's first valid option.
  if(selected && rows.some(([value])=>value===selected)){
    select.value=selected;
  }else if(rows.length){
    select.value=rows[0][0];
  }
}

function sizesUI(selected=[]){
  let box=$("sizes"),
  arr=$("category").value==="shoes"?SHOES:$("category").value==="accessories"?[]:CLOTHES;
  box.replaceChildren();
  if(!arr.length){
    box.textContent="—";
    return
  }
  arr.forEach(s=>{
    let l=document.createElement("label");l.className="size";let i=document.createElement("input");i.type="checkbox";i.value=s;i.checked=selected.includes(s);l.append(i,document.createTextNode(" "+s));box.append(l)
  })
}
 function applyText(){

 async function load(){
  let t=T();
  $("list").innerHTML=`<div class="status">${t.loading}</div>`;
  let {
    data,
    error
  }
  =await db.from("products").select("id,title,sku,category,subcategory,brand,price,image_url,tg_link,sizes").order("id",{
    ascending:false
  });
  if(error){
    $("list").textContent=t.error+error.message;
    return
  }
  products=data||[];
  render()
}
 function render(){
  if(!products)return;
  let t=T(),
  q=$("search").value.trim().toLowerCase(),
  cat=$("catFilter").value;
  let a=products.filter(p=>(String(p.title||"").toLowerCase().includes(q)||String(p.sku||"").toLowerCase().includes(q))&&(cat==="all"||p.category===cat));
  let sort=$("sort").value;
  if(sort==="old")a.sort((x,y)=>Number(x.id)-Number(y.id));
  else if(sort==="priceAsc")a.sort((x,y)=>Number(x.price)-Number(y.price));
  else if(sort==="priceDesc")a.sort((x,y)=>Number(y.price)-Number(x.price));
  else a.sort((x,y)=>Number(y.id)-Number(x.id));
  $("count").textContent=a.length;
  $("list").replaceChildren();
  if(!a.length){
    let d=document.createElement("div");
    d.className="status";
    d.textContent=t.empty;
    $("list").append(d);
    return
  }
  a.forEach(p=>{
    let item=document.createElement("div");item.className="item",info=document.createElement("div");info.className="info";let img=document.createElement("img");img.className="thumb";img.src=p.image_url||"";img.alt="";img.onerror=()=>img.style.visibility="hidden";let txt=document.createElement("div"),name=document.createElement("div");name.className="name";name.textContent=p.title||"—";let meta=document.createElement("div");meta.className="meta";meta.textContent=`${p.sku||"—"} · ${catName(p.category)} · ${p.brand||"—"} · ${fmtPrice(p.price)} · ${Array.isArray(p.sizes)?p.sizes.join(", "):"—"}`;txt.append(name,meta);info.append(img,txt);let acts=document.createElement("div");acts.className="item-actions";let e=document.createElement("button");e.className="btn ok";e.textContent=t.editBtn;e.onclick=()=>startEdit(p.id);let d=document.createElement("button");d.className="btn danger";d.textContent=t.del;d.onclick=()=>removeProduct(p.id);acts.append(e,d);item.append(info,acts);$("list").append(item)
  })
}
 function startEdit(id){
  let p=products.find(x=>String(x.id)===String(id));

 function cancelEdit(){

 async function uploadImage(file){
  let ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");
  let path=`${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  let {
    error
  }
  =await db.storage.from("products").upload(path,file);
  if(error)throw error;
  return db.storage.from("products").getPublicUrl(path).data.publicUrl
}
 $("productForm").addEventListener("submit",async e=>{
  e.preventDefault();let t=T(),btn=$("saveBtn");btn.disabled=true;try{

    };let result=editingId?await db.from("products").update(row).eq("id",editingId):await db.from("products").insert([row]);if(result.error)throw result.error;alert(t.saved);cancelEdit();await load()
  } catch(err){

  } finally{

 async function removeProduct(id){

(() => {

    en:{settings:"Settings",language:"Language",theme:"Theme",currency:"Currency",dark:"Dark",grey:"Grey",light:"Light"},
    be:{settings:"Налады",language:"Мова",theme:"Тэма",currency:"Валюта",dark:"Цёмная",grey:"Шэрая",light:"Светлая"},
    de:{settings:"Einstellungen",language:"Sprache",theme:"Thema",currency:"Währung",dark:"Dunkel",grey:"Grau",light:"Hell"},
    zh:{settings:"设置",language:"语言",theme:"主题",currency:"货币",dark:"深色",grey:"灰色",light:"浅色"},
    pl:{settings:"Ustawienia",language:"Język",theme:"Motyw",currency:"Waluta",dark:"Ciemny",grey:"Szary",light:"Jasny"}
  };

  const open=()=>document.body.classList.add("drawer-open");
  const shut=()=>document.body.classList.remove("drawer-open");
  menu?.addEventListener("click",open);
  close?.addEventListener("click",shut);
  backdrop?.addEventListener("click",shut);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});

  function paintTheme(){
    const v=theme.value;
    document.body.classList.toggle("light",v==="light");
    document.body.classList.toggle("grey",v==="grey");
  }
  function paintDrawerText(){
    const t=drawerText[lang.value]||drawerText.uk;
    document.getElementById("drawerSettingsTitle").textContent=t.settings;
    document.getElementById("drawerLangLabel").textContent=t.language;
    document.getElementById("drawerThemeLabel").textContent=t.theme;
    document.getElementById("drawerCurrencyLabel").textContent=t.currency;
    const labels={dark:t.dark,grey:t.grey,light:t.light};
    [...theme.options].forEach(o=>o.textContent=labels[o.value]||o.textContent);
  }

  // Existing admin code handles persistence/rendering; these listeners add the new visual layer.
  theme.addEventListener("change",()=>{paintTheme();localStorage.setItem("admin_theme",theme.value)});
  lang.addEventListener("change",paintDrawerText);

  // Old versions only knew dark/light. Restore grey correctly after their initialization has run.
  const saved=localStorage.getItem("admin_theme");
  if(saved && [...theme.options].some(o=>o.value===saved)) theme.value=saved;
  paintTheme();
  paintDrawerText();
})();
</script>
